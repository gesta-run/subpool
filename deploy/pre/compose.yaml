name: subpool-pre

services:
  subpool:
    image: ${SUBPOOL_IMAGE:?Set SUBPOOL_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUBPOOL_LISTEN_ADDRESS: ":8080"
      SUBPOOL_PUBLIC_URL: ${SUBPOOL_PUBLIC_URL:?Set SUBPOOL_PUBLIC_URL}
      SUBPOOL_DATABASE_URL: postgres://subpool:${SUBPOOL_POSTGRES_PASSWORD:?Set SUBPOOL_POSTGRES_PASSWORD}@postgres:5432/subpool?sslmode=disable
      SUBPOOL_ADMIN_USERNAME: ${SUBPOOL_ADMIN_USERNAME:?Set SUBPOOL_ADMIN_USERNAME}
      SUBPOOL_ADMIN_PASSWORD: ${SUBPOOL_ADMIN_PASSWORD:?Set SUBPOOL_ADMIN_PASSWORD}
      SUBPOOL_CREDENTIAL_KEY: ${SUBPOOL_CREDENTIAL_KEY:?Set SUBPOOL_CREDENTIAL_KEY}
      SUBPOOL_API_KEY_HMAC_KEY: ${SUBPOOL_API_KEY_HMAC_KEY:?Set SUBPOOL_API_KEY_HMAC_KEY}
      SUBPOOL_RESPONSES_WS_ENABLED: ${SUBPOOL_RESPONSES_WS_ENABLED:-true}
      SUBPOOL_RESPONSES_WS_FORCE_HTTP_BRIDGE: ${SUBPOOL_RESPONSES_WS_FORCE_HTTP_BRIDGE:-false}
    ports:
      - "${SUBPOOL_HOST_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: subpool
      POSTGRES_PASSWORD: ${SUBPOOL_POSTGRES_PASSWORD:?Set SUBPOOL_POSTGRES_PASSWORD}
      POSTGRES_DB: subpool
    volumes:
      - subpool-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subpool -d subpool"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  subpool-postgres:
