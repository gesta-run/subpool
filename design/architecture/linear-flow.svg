    <g fill="#0F172A" font-size="15" font-weight="650" text-anchor="middle"><text x="177" y="495">Administrator</text><text x="177" y="519" fill="#64748B" font-size="12" font-weight="500">Browser session</text><text x="450" y="495">React console</text><text x="450" y="519" fill="#64748B" font-size="12" font-weight="500">Accounts · pools · keys</text><text x="713" y="495">Control API</text><text x="713" y="519" fill="#64748B" font-size="12" font-weight="500">Audit · configuration</text><text x="956" y="495">PostgreSQL</text><text x="956" y="519" fill="#64748B" font-size="12" font-weight="500">Encrypted metadata</text></g>
    <g fill="none" stroke="#22A6F2" stroke-width="2" marker-end="url(#arrow)"><path d="M282 500H340"/><path d="M560 500H618"/><path d="M808 500H890"/><path d="M713 454V348C713 332 700 318 684 318"/></g>

    <rect x="72" y="628" width="1296" height="64" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="72" y="628" width="7" height="64" rx="3.5" fill="url(#brand)"/>
    <text x="104" y="655" fill="#0F172A" font-size="14" font-weight="650">Single Go service</text>
    <text x="104" y="677" fill="#64748B" font-size="13">Embedded console · unified API · encrypted credentials · aggregate token counters only</text>
  </g>
