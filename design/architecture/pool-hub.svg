<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Subpool hub architecture</title>
  <desc id="desc">A pool-centric architecture showing the scheduler as the hub between authenticated employee requests and multiple subscription accounts, with administration and persistence below.</desc>
  <defs>
    <radialGradient id="hub" cx="35%" cy="28%" r="80%"><stop stop-color="#30B7F5"/><stop offset="1" stop-color="#4F46E5"/></radialGradient>
    <filter id="shadow3" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#162A48" flood-opacity=".10"/></filter>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#22A6F2"/></marker>
  </defs>
  <rect width="1440" height="820" fill="#FFFFFF"/>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="72" y="76" fill="#0F172A" font-size="34" font-weight="700" letter-spacing="-1">The pool is the routing boundary</text>
    <text x="72" y="108" fill="#64748B" font-size="15">Stable employee keys on the left. Rotating subscription capacity on the right.</text>
    <path d="M72 136H1368" stroke="#E2E8F0"/>

    <g filter="url(#shadow3)">
      <rect x="72" y="225" width="236" height="94" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="72" y="357" width="236" height="94" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    </g>
    <g fill="#0F172A" text-anchor="middle"><text x="190" y="264" font-size="15" font-weight="700">Employee API key</text><text x="190" y="289" fill="#64748B" font-size="12">sk-… · Responses API</text><text x="190" y="396" font-size="15" font-weight="700">Continuation request</text><text x="190" y="421" fill="#64748B" font-size="12">Session affinity preserved</text></g>

    <g filter="url(#shadow3)"><rect x="378" y="246" width="218" height="184" rx="26" fill="#F7FBFE" stroke="#A9DDF8"/></g>
    <circle cx="421" cy="290" r="17" fill="#E0F4FD"/><path d="M413 290h16M421 282v16" stroke="#1687C8" stroke-width="2"/>
    <text x="454" y="295" fill="#1687C8" font-size="12" font-weight="750" letter-spacing="1.3">GATEWAY</text>
    <text x="406" y="340" fill="#0F172A" font-size="16" font-weight="700">Authenticate</text><text x="406" y="365" fill="#64748B" font-size="12">Scope and rate limit</text>
    <text x="406" y="397" fill="#0F172A" font-size="16" font-weight="700">Normalize</text><text x="406" y="420" fill="#64748B" font-size="12">OpenAI-compatible wire API</text>

    <g filter="url(#shadow3)"><circle cx="758" cy="338" r="126" fill="url(#hub)"/></g>
    <circle cx="758" cy="338" r="99" fill="none" stroke="#FFFFFF" stroke-opacity=".28"/>
    <text x="758" y="310" fill="#FFFFFF" font-size="12" font-weight="750" letter-spacing="1.8" text-anchor="middle">ACCOUNT POOL</text>
    <text x="758" y="348" fill="#FFFFFF" font-size="23" font-weight="700" text-anchor="middle">Scheduler</text>
    <text x="758" y="378" fill="#E9F7FF" font-size="12" text-anchor="middle">health · slots · least assigned</text>
    <text x="758" y="401" fill="#E9F7FF" font-size="12" text-anchor="middle">retry · session affinity</text>

    <g filter="url(#shadow3)">
      <rect x="1038" y="178" width="286" height="96" rx="18" fill="#FFFFFF" stroke="#BFC8F5"/>
      <rect x="1080" y="304" width="286" height="96" rx="18" fill="#FFFFFF" stroke="#BFC8F5"/>
      <rect x="1038" y="430" width="286" height="96" rx="18" fill="#FFFFFF" stroke="#BFC8F5"/>
    </g>
    <g fill="#0F172A"><circle cx="1074" cy="218" r="10" fill="#22A6F2"/><text x="1098" y="222" font-size="15" font-weight="700">Codex account A</text><text x="1098" y="247" fill="#64748B" font-size="12">Active · weekly capacity available</text><circle cx="1116" cy="344" r="10" fill="#22A6F2"/><text x="1140" y="348" font-size="15" font-weight="700">Codex account B</text><text x="1140" y="373" fill="#64748B" font-size="12">Active · request slot available</text><circle cx="1074" cy="470" r="10" fill="#F59E0B"/><text x="1098" y="474" font-size="15" font-weight="700">Codex account N</text><text x="1098" y="499" fill="#64748B" font-size="12">Cooling down · temporarily skipped</text></g>

    <g fill="none" stroke="#22A6F2" stroke-width="2" marker-end="url(#arrow3)"><path d="M308 272H378"/><path d="M308 404C348 404 338 384 378 384"/><path d="M596 338H632"/><path d="M881 303C948 270 972 226 1038 226"/><path d="M884 338C962 338 1000 352 1080 352"/><path d="M881 376C948 410 972 478 1038 478"/></g>

    <rect x="72" y="604" width="1296" height="132" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="104" y="641" fill="#4F46E5" font-size="12" font-weight="750" letter-spacing="1.5">CONTROL + PERSISTENCE</text>
    <g fill="#0F172A" font-size="14" font-weight="650"><text x="104" y="683">Admin console</text><text x="342" y="683">Control API</text><text x="574" y="683">OAuth vault</text><text x="806" y="683">PostgreSQL</text><text x="1052" y="683">Usage counters</text></g>
    <g fill="#64748B" font-size="11"><text x="104" y="706">accounts · pools · keys</text><text x="342" y="706">settings · audit</text><text x="574" y="706">encrypted at rest</text><text x="806" y="706">durable configuration</text><text x="1052" y="706">input + output only</text></g>
    <g stroke="#CBD5E1"><path d="M302 650v58"/><path d="M534 650v58"/><path d="M766 650v58"/><path d="M1012 650v58"/></g>
    <path d="M758 464V604" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="5 7"/>
  </g>
</svg>
