    <rect x="354" y="240" width="732" height="196" rx="20" fill="#F6FBFE" stroke="#B9E4F8"/>
    <text x="382" y="275" fill="#1687C8" font-size="12" font-weight="750" letter-spacing="1.5">DATA PLANE</text>
    <text x="382" y="303" fill="#0F172A" font-size="18" font-weight="700">Request path</text>
