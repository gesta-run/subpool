<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Subpool two-plane stack architecture</title>
  <desc id="desc">A self-hosted Subpool stack divided into control and data planes, connected to employee clients, administrators, PostgreSQL, and upstream subscriptions.</desc>
  <defs>
    <linearGradient id="brand2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22A6F2"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#182B49" flood-opacity=".09"/></filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4F46E5"/></marker>
  </defs>
  <rect width="1440" height="820" fill="#FFFFFF"/>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="72" y="76" fill="#0F172A" font-size="34" font-weight="700" letter-spacing="-1">Control and data planes</text>
    <text x="72" y="108" fill="#64748B" font-size="15">One self-hosted stack, two deliberately separated responsibilities</text>

