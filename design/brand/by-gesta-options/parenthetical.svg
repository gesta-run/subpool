  <text x="20" y="105" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-5"><tspan class="ink">subp</tspan><tspan fill="#22A6F2">o</tspan><tspan fill="#4F46E5">o</tspan><tspan class="ink">l</tspan></text>
