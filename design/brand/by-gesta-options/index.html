<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subpool by Gesta — lockup options</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; background: #0f1117; color: #f7f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px; }
    header { max-width: 1180px; margin: 0 auto 32px; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 0; color: #94a3b8; }
    main { max-width: 1180px; margin: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 26px; border: 1px solid #2b3443; border-radius: 18px; background: #1b1e25; }
    img { width: 100%; display: block; }
    figcaption { margin-top: 16px; color: #cbd5e1; font-size: 14px; }
    strong { color: #fff; }
    @media (max-width: 820px) { body { padding: 24px; } main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>Subpool by Gesta</h1><p>Six endorsement lockup directions for the README header.</p></header>
  <main>
    <figure><img src="quiet-signature.svg" alt="Quiet signature"><figcaption><strong>01 Quiet signature</strong> — clean and understated.</figcaption></figure>
    <figure><img src="editorial-rule.svg" alt="Editorial rule"><figcaption><strong>02 Editorial rule</strong> — structured and technical.</figcaption></figure>
    <figure><img src="parenthetical.svg" alt="Parenthetical signature"><figcaption><strong>03 Parenthetical</strong> — friendly and editorial.</figcaption></figure>
    <figure><img src="gradient-tag.svg" alt="Gradient endorsement"><figcaption><strong>04 Gradient tag</strong> — prominent and product-led.</figcaption></figure>
    <figure><img src="brand-seal.svg" alt="Brand seal"><figcaption><strong>05 Brand seal</strong> — links the two brands visually.</figcaption></figure>
    <figure><img src="slash-lockup.svg" alt="Slash lockup"><figcaption><strong>06 Slash lockup</strong> — minimal with a sharp accent.</figcaption></figure>
  </main>
</body>
</html>
