<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Subpool usage refinement 01 — Minimal polish</title>
  <desc id="desc">The existing dark usage page with tighter spacing, readable token totals, and a cleaner expanded model row.</desc>
  <defs>
    <style>
      .ui{font-family:'Geist Sans','Aptos','Segoe UI',sans-serif}.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace;font-variant-numeric:tabular-nums}.ink{fill:#FAFAFA}.soft{fill:#C7C7C7}.muted{fill:#8C8C8C}.label{fill:#949494;font-size:10px;font-weight:700;letter-spacing:1.2px}.rule{stroke:#2B2B2B}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#0A0A0A"/>
  <rect width="76" height="1000" fill="#0C0C0C"/><path d="M76 0V1000" stroke="#282828"/>
  <g fill="none" stroke="#777" stroke-width="1.7" stroke-linecap="round"><path d="M29 128H47M29 134H43M29 140H39"/><circle cx="38" cy="220" r="9"/><path d="M30 306H46M30 314H46M30 322H41"/><path d="M30 413V399M38 413V389M46 413V404" stroke="#FAFAFA"/><circle cx="38" cy="506" r="9"/><path d="M38 494V497M38 515V518M26 506H29M47 506H50"/></g>
  <rect x="0" y="374" width="3" height="54" rx="1.5" fill="#6EA8FE"/>
  <circle cx="38" cy="948" r="17" fill="#262626"/><text x="38" y="953" class="ui soft" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <rect x="76" width="1524" height="68" fill="#0A0A0A"/><path d="M76 68H1600" stroke="#282828"/>
  <text x="126" y="42" class="ui soft" font-size="13" font-weight="600">Usage</text><text x="1518" y="42" class="ui muted" font-size="12" text-anchor="end">Sign out</text>

  <g class="ui">
    <text x="126" y="137" class="ink" font-size="32" font-weight="650" letter-spacing="-.8">Token usage</text>
    <text x="126" y="166" class="muted" font-size="14">Input and output totals per API key. Request content is never stored.</text>
    <rect x="1260" y="118" width="278" height="44" rx="7" fill="#171717" stroke="#333"/>
    <text x="1278" y="145" class="soft" font-size="12" font-weight="600">Last 7 days</text><text x="1518" y="145" class="muted" font-size="12" text-anchor="end">Aug 27 – Sep 2 ⌄</text>
  </g>

  <g class="ui">
    <rect x="126" y="214" width="448" height="124" rx="10" fill="#171717" stroke="#2B2B2B"/>
    <text x="150" y="245" class="label">INPUT TOKENS</text><text x="150" y="291" class="ink mono" font-size="35" font-weight="650">1,028</text><text x="150" y="317" class="muted" font-size="11">Prompt and cached input</text>
    <rect x="590" y="214" width="448" height="124" rx="10" fill="#171717" stroke="#2B2B2B"/>
    <text x="614" y="245" class="label">OUTPUT TOKENS</text><text x="614" y="291" class="ink mono" font-size="35" font-weight="650">176</text><text x="614" y="317" class="muted" font-size="11">Generated output</text>
    <rect x="1054" y="214" width="484" height="124" rx="10" fill="#171717" stroke="#2B2B2B"/>
    <text x="1078" y="245" class="label">TOTAL TOKENS</text><text x="1078" y="291" class="ink mono" font-size="35" font-weight="650">1,204</text><text x="1078" y="317" class="muted" font-size="11">Across 1 active API key</text>
  </g>

  <rect x="126" y="366" width="1412" height="474" rx="10" fill="#151515" stroke="#2B2B2B"/>
  <g class="ui">
    <text x="150" y="406" class="ink" font-size="15" font-weight="650">Usage by API key</text><text x="150" y="429" class="muted" font-size="12">Expand a key to inspect its model totals.</text>
    <rect x="1415" y="389" width="99" height="36" rx="7" fill="#202020" stroke="#353535"/><text x="1464" y="412" class="soft" font-size="11" font-weight="600" text-anchor="middle">Refresh</text>
    <path d="M126 452H1538" class="rule"/>
    <text x="150" y="482" class="label">EMPLOYEE</text><text x="514" y="482" class="label">API KEY</text><text x="913" y="482" class="label" text-anchor="end">INPUT</text><text x="1135" y="482" class="label" text-anchor="end">OUTPUT</text><text x="1508" y="482" class="label" text-anchor="end">TOTAL</text>
    <path d="M126 502H1538" class="rule"/>
    <rect x="142" y="522" width="34" height="34" rx="7" fill="#202B37" stroke="#345679"/><path d="M153 544L159 537L165 544" stroke="#6EA8FE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="192" y="538" class="ink" font-size="14" font-weight="650">Wei</text><text x="192" y="557" class="muted" font-size="11">2 models</text>
    <text x="514" y="546" class="soft mono" font-size="12">••••3UgA</text><text x="913" y="546" class="soft mono" font-size="13" text-anchor="end">1,028</text><text x="1135" y="546" class="soft mono" font-size="13" text-anchor="end">176</text><text x="1508" y="546" class="ink mono" font-size="13" font-weight="700" text-anchor="end">1,204</text>
    <path d="M142 581H1522" class="rule"/>
    <rect x="150" y="600" width="1364" height="196" rx="8" fill="#101010" stroke="#2B2B2B"/>
    <text x="174" y="632" class="label">MODEL BREAKDOWN</text><text x="913" y="632" class="label" text-anchor="end">INPUT</text><text x="1135" y="632" class="label" text-anchor="end">OUTPUT</text><text x="1482" y="632" class="label" text-anchor="end">TOTAL</text>
    <path d="M174 650H1490" class="rule"/>
    <circle cx="182" cy="681" r="4" fill="#6EA8FE"/><text x="198" y="686" class="ink mono" font-size="12" font-weight="600">gpt-5.4</text><text x="913" y="686" class="soft mono" font-size="12" text-anchor="end">192</text><text x="1135" y="686" class="soft mono" font-size="12" text-anchor="end">176</text><text x="1482" y="686" class="ink mono" font-size="12" font-weight="700" text-anchor="end">368</text>
    <path d="M174 708H1490" class="rule"/>
    <circle cx="182" cy="740" r="4" fill="#606060"/><text x="198" y="739" class="ink mono" font-size="12" font-weight="600">Unattributed</text><text x="198" y="756" class="muted" font-size="10">Historical usage</text><text x="913" y="745" class="soft mono" font-size="12" text-anchor="end">836</text><text x="1135" y="745" class="soft mono" font-size="12" text-anchor="end">0</text><text x="1482" y="745" class="ink mono" font-size="12" font-weight="700" text-anchor="end">836</text>
  </g>
  <text x="126" y="884" class="ui muted" font-size="11">Values below one million are displayed as exact numbers instead of 0.00M.</text>
</svg>
