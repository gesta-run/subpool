<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Provider accounts — consolidated health concept</title>
  <desc id="desc">A recommended four-column Subpool accounts table that groups availability and last checked information.</desc>
  <defs>
    <style>
